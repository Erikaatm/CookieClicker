<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie clicker</title>
    <script src="js/jquery.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

    <script type="module" src="js/particles.js"></script>
    <script src="js/game.js"></script>
    <script src="js/upgrade.js"></script>
    <script src="js/script.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="game-container">
        <div id="main-game-content">
            <div id="tsparticles"></div>
            <header id="game-header">
                <h1 id="game-title">Cookie Clicker</h1>
                <div id="user-info">
                    <span id="user-name"></span>
                    <button id="logout-btn">Cerrar sesión</button>
                </div>
            </header>
            <main id="clicker-area">
                <img id="main-cookie" src="assets/cookieChips.png" alt="cookie" />
                <div id="click-effects"></div>
                <section id="stats-section">
                    <p style="color: #ddd;">Haz clic para conseguir cookies</p>
                    <div class="stat">
                        <h3>Cookies</h3>
                        <p id="cookie-count" style="color: #ddd;">0</p>
                    </div>
                    <div class="stat">
                        <h3>Cookies por segundo</h3>
                        <p id="cps" style="color: #ddd;">0</p>
                        <h3>Cookies por click</h3>
                        <p id="cpc" style="color: #ddd;">0</p>
                    </div>

                    <div style="margin-top: 20px;">
                        <button id="generar-pdf" class="btn-reporte">Descargar Informe PDF</button>
                    </div>

                    <div style="position: absolute; left: -9999px;">
                        <canvas id="grafico-stats" width="400" height="200"></canvas>
                    </div>
                </section>
            </main>
            <footer>
                <p>Desarrollado por <strong>Eri</strong> © 2025</p>
            </footer>
        </div>
        <div id="upgrades-section">
            <h2>Mejoras</h2>
            <div id="upgrade-list"></div>

        </div>
    </div>
</body>

</html>
