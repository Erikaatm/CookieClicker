<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie clicker - User Info</title>

    <script src="js/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <script type="module" src="js/particles.js"></script>
    <script src="js/script.js"></script>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- Contenedor principal de la informacion del usuario -->
    <div id="profile-container">
        <h2>Mi perfil</h2>

        <div id="profile-info">
            <p> <strong>Nombre usuario:</strong> <span id="profile-username"></span> </p>
            <p> <strong>Email:</strong> <span id="profile-email"></span> </p>
            <p> <strong>Teléfono:</strong> <span id="profile-phone"></span> </p>
        </div>

        <div id="profile-password">
            <button id="back-btn">Volver</button>
            <button id="change-password-btn">Cambiar contraseña</button>
            <button id="btn-delete">Delete Account</button>
        </div>

    </div>


</body>

</html>
